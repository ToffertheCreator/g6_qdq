{% extends 'base.html' %}

{% block head %}
<title>Manila Rail Transit Map</title>
{% endblock %}

{% block body %}
<div class="map-header">
    <div class="top-bar">
        <div>
            <h1>MRT/LRT MAP</h1>
            <p style="margin:4px 0 0 0; font-size:0.95rem; color:#aaa;">Manila Rail Transit Network</p>
            <div class="legend">
                <div class="legend-item"><div class="legend-pill" style="background: var(--lrt1-color);"></div> LRT-1</div>
                <div class="legend-item"><div class="legend-pill" style="background: var(--lrt2-color);"></div> LRT-2</div>
                <div class="legend-item"><div class="legend-pill" style="background: var(--mrt3-color);"></div> MRT-3</div>
            </div>
        </div>
        
        <div class="dropdown-container">
            <select id="start-select" aria-label="Start station">
                <option value="">Start</option>
            </select>
            <select id="end-select" aria-label="End station">
                <option value="">End</option>
            </select>
        </div>

        <div class="path-panel" id="path-display">
            Tap a station to set your departure point.
        </div>

        <div class="actions">
            <button id="find-path-btn" class="btn-primary">Find Route</button>
            <button id="reset-btn" class="btn-secondary">Reset</button>
        </div>
    </div>
</div>

<div class="map-viewport">
    <canvas id="map-canvas"></canvas>
    <div class="station-tooltip" id="tooltip"></div>
</div>

<script>
    const stationData = [
        // MRT-3
        {name: 'North Ave', x: 600, y: 120, line: 'MRT-3', color: '#0038A8'},
        {name: 'Quezon Ave', x: 620, y: 200, line: 'MRT-3', color: '#0038A8'},
        {name: 'Kamuning', x: 640, y: 260, line: 'MRT-3', color: '#0038A8'},
        {name: 'Cubao MRT', x: 660, y: 330, line: 'MRT-3', color: '#0038A8', isTransfer: true},
        {name: 'Santolan MRT', x: 700, y: 420, line: 'MRT-3', color: '#0038A8'},
        {name: 'Ortigas', x: 730, y: 520, line: 'MRT-3', color: '#0038A8'},
        {name: 'Shaw Blvd', x: 750, y: 600, line: 'MRT-3', color: '#0038A8'},
        {name: 'Boni', x: 760, y: 670, line: 'MRT-3', color: '#0038A8'},
        {name: 'Guadalupe', x: 760, y: 740, line: 'MRT-3', color: '#0038A8'},
        {name: 'Buendia', x: 730, y: 808, line: 'MRT-3', color: '#0038A8'},
        {name: 'Ayala', x: 680, y: 880, line: 'MRT-3', color: '#0038A8'},
        {name: 'Magallanes', x: 550, y: 920, line: 'MRT-3', color: '#0038A8'},
        {name: 'Taft Ave', x: 380, y: 915, line: 'MRT-3', color: '#0038A8', isTransfer: true},
        // LRT-1
        {name: 'Fernando Poe Jr.', x: 520, y: 120,  line: 'LRT-1', color: '#FFCD00'},
        {name: 'Balintawak',        x: 400, y: 120, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Monumento',         x: 260, y: 180, line: 'LRT-1', color: '#FFCD00'},
        {name: '5th Ave',           x: 260, y: 225, line: 'LRT-1', color: '#FFCD00'},
        {name: 'R. Papa',           x: 260, y: 270, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Abad Santos',       x: 260, y: 315, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Blumentritt',       x: 260, y: 360, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Tayuman',           x: 260, y: 405, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Bambang',           x: 260, y: 450, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Doroteo Jose',      x: 270, y: 505, line: 'LRT-1', color: '#FFCD00', isTransfer: true},
        {name: 'Carriedo',          x: 285, y: 550, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Central Terminal',  x: 300, y: 595, line: 'LRT-1', color: '#FFCD00'},
        {name: 'United Nations',    x: 330, y: 640, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Pedro Gil',         x: 335, y: 685, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Quirino Ave',       x: 340, y: 730, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Vito Cruz',         x: 345, y: 775, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Gil Puyat',         x: 350, y: 820, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Libertad',          x: 352, y: 865, line: 'LRT-1', color: '#FFCD00'},
        {name: 'EDSA',              x: 355, y: 910, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Baclaran',          x: 358, y: 955, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Redemptorist–Aseana', x: 360, y: 1000, line: 'LRT-1', color: '#FFCD00'},
        {name: 'MIA Road',          x: 360, y: 1045, line: 'LRT-1', color: '#FFCD00'},
        {name: 'PITX',              x: 360, y: 1090, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Ninoy Aquino Ave',  x: 360, y: 1135, line: 'LRT-1', color: '#FFCD00'},
        {name: 'Dr. Santos',        x: 360, y: 1180, line: 'LRT-1', color: '#FFCD00'},
        // LRT-2
        {name: 'Recto', x: 320, y: 505, line: 'LRT-2', color: '#5B2D82', isTransfer: true},
        {name: 'Legarda', x: 380, y: 505, line: 'LRT-2', color: '#5B2D82'},
        {name: 'Pureza', x: 440, y: 490, line: 'LRT-2', color: '#5B2D82'},
        {name: 'V. Mapa', x: 500, y: 470, line: 'LRT-2', color: '#5B2D82'},
        {name: 'J. Ruiz', x: 560, y: 445, line: 'LRT-2', color: '#5B2D82'},
        {name: 'Gilmore', x: 620, y: 410, line: 'LRT-2', color: '#5B2D82'},
        {name: 'Betty Go-Belmonte', x: 660, y: 370, line: 'LRT-2', color: '#5B2D82'},
        {name: 'Cubao LRT', x: 680, y: 330, line: 'LRT-2', color: '#5B2D82', isTransfer: true},
        {name: 'Anonas', x: 760, y: 300, line: 'LRT-2', color: '#5B2D82'},
        {name: 'Katipunan', x: 860, y: 270, line: 'LRT-2', color: '#5B2D82'},
        {name: 'Santolan LRT', x: 960, y: 240, line: 'LRT-2', color: '#5B2D82'},
    ];

    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const pathDisplay = document.getElementById('path-display');
    const findPathBtn = document.getElementById('find-path-btn');
    const resetBtn = document.getElementById('reset-btn');
    const startSelect = document.getElementById('start-select');
    const endSelect = document.getElementById('end-select');

    let startStation = null;
    let goalStation = null;
    let highlightedPath = [];

    // Zoom and pan variables
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    // Responsive canvas sizing
    function resizeCanvas() {
        const container = canvas.parentElement;
        const maxWidth = Math.min(1200, container.clientWidth - 40);
        const maxHeight = Math.min(800, window.innerHeight - 250);
        
        canvas.width = maxWidth;
        canvas.height = maxHeight;
        drawMap();
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const scale = 1;

    function populateDropdowns() {
        startSelect.innerHTML = '<option value="">Start</option>';
        endSelect.innerHTML = '<option value="">End</option>';
        stationData.forEach(s => {
            const opt1 = document.createElement('option'); opt1.value = s.name; opt1.text = s.name;
            const opt2 = opt1.cloneNode(true);
            startSelect.appendChild(opt1);
            endSelect.appendChild(opt2);
        });
    }

    populateDropdowns();

    startSelect.addEventListener('change', () => {
        const val = startSelect.value;
        startStation = stationData.find(s => s.name === val) || null;
        if (startStation && !endSelect.value) pathDisplay.innerHTML = `Departure: <b>${startStation.name}</b>. Now choose destination.`;
        if (startStation && endSelect.value) pathDisplay.innerHTML = `Selected: <b>${startStation.name}</b> to <b>${endSelect.value}</b>. Find route?`;
        drawMap();
    });

    endSelect.addEventListener('change', () => {
        const val = endSelect.value;
        goalStation = stationData.find(s => s.name === val) || null;
        if (goalStation && !startSelect.value) pathDisplay.innerHTML = `Destination: <b>${goalStation.name}</b>. Now choose departure.`;
        if (goalStation && startSelect.value) pathDisplay.innerHTML = `Selected: <b>${startSelect.value}</b> to <b>${goalStation.name}</b>. Find route?`;
        drawMap();
    });

    function drawMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(zoom, zoom);
        ctx.translate(-canvas.width / 2 + panX, -canvas.height / 2 + panY);
        
        const lineWidth = 10;
        const stationRadius = 6;
        const transferRadius = 9;

        // 1. Draw Physical Transfers (Dashed connection lines)
        ctx.setLineDash([5, 8]);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 4;
        const transfers = [['Recto', 'Doroteo Jose']];
        transfers.forEach(([a, b]) => {
            const s1 = stationData.find(s => s.name === a);
            const s2 = stationData.find(s => s.name === b);
            if(s1 && s2) {
                ctx.beginPath();
                ctx.moveTo(s1.x, s1.y);
                ctx.lineTo(s2.x, s2.y);
                ctx.stroke();
            }
        });
        ctx.setLineDash([]);

        // 2. Draw Rail Lines
        const lines = ['LRT-1', 'LRT-2', 'MRT-3'];
        lines.forEach(lineName => {
            const lineStations = stationData.filter(s => s.line === lineName);
            if(lineStations.length > 0) {
                ctx.strokeStyle = lineStations[0].color;
                ctx.lineWidth = lineWidth;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                ctx.beginPath();
                lineStations.forEach((s, i) => {
                    if (i === 0) ctx.moveTo(s.x, s.y);
                    else ctx.lineTo(s.x, s.y);
                });
                ctx.stroke();
            }
        });

        // 3. Highlighted Path
        if (highlightedPath.length > 1) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = lineWidth + 6;
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            highlightedPath.forEach((name, i) => {
                const s = stationData.find(st => st.name === name);
                if (s) {
                    if (i === 0) ctx.moveTo(s.x, s.y);
                    else ctx.lineTo(s.x, s.y);
                }
            });
            ctx.stroke();
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        // 4. Draw Stations and Labels
        stationData.forEach(station => {
            const isStart = startStation && startStation.name === station.name;
            const isGoal = goalStation && goalStation.name === station.name;
            const isInPath = highlightedPath.includes(station.name);
            
            const sx = station.x;
            const sy = station.y;

            if (isStart || isGoal) {
                ctx.beginPath();
                ctx.arc(sx, sy, 14, 0, Math.PI * 2);
                ctx.fillStyle = isStart ? 'rgba(0, 255, 0, 0.3)' : 'rgba(255, 0, 0, 0.3)';
                ctx.fill();
            }

            ctx.beginPath();
            if (station.isTransfer) {
                ctx.arc(sx, sy, transferRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#000';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
            } else {
                ctx.arc(sx, sy, stationRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#151515';
                ctx.fill();
                ctx.strokeStyle = station.color;
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }

            ctx.fillStyle = isInPath ? '#fff' : '#aaa';
            ctx.font = isInPath ? 'bold 14px Arial' : '500 13px Arial';
            
            let offsetX = 16, align = 'left';

            if (station.line === 'LRT-1') {
                offsetX = -16;
                align = 'right';
            }

            if (station.name === 'Fernando Poe Jr.') {
                ctx.textAlign = 'center';
                ctx.fillText(station.name, sx, sy + 20); // below
                return;
            }

            if (station.name === 'Betty Go-Belmonte') {
                ctx.textAlign = 'left';
                ctx.fillText(station.name, sx + 14, sy - 1); // upper-right
                return;
            }
            
            if (station.name === 'Cubao MRT') {
                ctx.textAlign = 'right';
                ctx.fillText(station.name, sx - 14, sy - 3); // left & up
                return;
            }
            if (station.name === 'Cubao LRT') {
                ctx.textAlign = 'left';
                ctx.fillText(station.name, sx + 14, sy + 8); // right & down
                return;
            }

            if (station.name === 'Recto') {
                ctx.textAlign = 'center';
                ctx.fillText(station.name, sx, sy + 22);
            }
            else if (station.line === 'LRT-2' && !station.isTransfer && station.name !== 'Betty Go-Belmonte') {
                const isBottom = station.y > 450;
                ctx.textAlign = 'center';
                ctx.fillText(station.name, sx, sy + (isBottom ? 22 : -18));
            } else {
                ctx.textAlign = align;
                ctx.fillText(station.name, sx + offsetX, sy + 4);
            }
        });
        
        ctx.restore();
    }

    // Touch support variables
    let lastTouchDistance = 0;
    let lastTouchCenter = { x: 0, y: 0 };

    // Touch start
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        
        if (e.touches.length === 1) {
            // Single touch - pan
            isDragging = true;
            dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
            // Two touches - zoom
            isDragging = false;
            const touch1 = e.touches[0];
            const touch2 = e.touches[1];
            lastTouchDistance = Math.sqrt(
                Math.pow(touch2.clientX - touch1.clientX, 2) +
                Math.pow(touch2.clientY - touch1.clientY, 2)
            );
            lastTouchCenter = {
                x: (touch1.clientX + touch2.clientX) / 2,
                y: (touch1.clientY + touch2.clientY) / 2
            };
        }
    }, { passive: false });

    // Touch move
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        
        if (e.touches.length === 1 && isDragging) {
            // Single touch - pan
            const touch = e.touches[0];
            const deltaX = touch.clientX - dragStart.x;
            const deltaY = touch.clientY - dragStart.y;
            panX += deltaX;
            panY += deltaY;
            dragStart = { x: touch.clientX, y: touch.clientY };
            drawMap();
        } else if (e.touches.length === 2) {
            // Two touches - pinch zoom
            const touch1 = e.touches[0];
            const touch2 = e.touches[1];
            const distance = Math.sqrt(
                Math.pow(touch2.clientX - touch1.clientX, 2) +
                Math.pow(touch2.clientY - touch1.clientY, 2)
            );
            
            if (lastTouchDistance > 0) {
                const zoomChange = (distance - lastTouchDistance) * 0.01;
                const newZoom = zoom + zoomChange;
                zoom = Math.max(0.5, Math.min(newZoom, 3));
                drawMap();
            }
            
            lastTouchDistance = distance;
        }
    }, { passive: false });

    // Touch end
    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        
        if (e.touches.length === 0) {
            isDragging = false;
            lastTouchDistance = 0;
            
            // Handle tap for station selection
            if (e.changedTouches.length === 1) {
                const touch = e.changedTouches[0];
                const rect = canvas.getBoundingClientRect();
                const touchX = touch.clientX - rect.left;
                const touchY = touch.clientY - rect.top;
                const { x, y } = screenToWorld(touchX, touchY);
                
                const clicked = stationData.find(s => Math.sqrt((s.x - x)**2 + (s.y - y)**2) < 25);
                
                if (clicked) {
                    if (!startStation || (startStation && goalStation)) {
                        startStation = clicked; goalStation = null; highlightedPath = [];
                        pathDisplay.innerHTML = `Departure: <b>${startStation.name}</b>. Now tap your destination.`;
                        startSelect.value = startStation.name;
                        endSelect.value = '';
                    } else {
                        goalStation = clicked;
                        pathDisplay.innerHTML = `Selected: <b>${startStation.name}</b> to <b>${goalStation.name}</b>. Find route?`;
                        endSelect.value = goalStation.name;
                    }
                    drawMap();
                }
            }
        } else if (e.touches.length === 1) {
            // One finger remaining, reset drag
            dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
    }, { passive: false });

    // Mouse wheel zoom
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSpeed = 0.1;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const newZoom = zoom + (e.deltaY > 0 ? -zoomSpeed : zoomSpeed);
        zoom = Math.max(0.5, Math.min(newZoom, 3));
        drawMap();
    });

    // Mouse drag pan
    canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStart = { x: e.offsetX, y: e.offsetY };
    });

    function screenToWorld(mx, my) {
        return {
            x: (mx - canvas.width / 2) / zoom + canvas.width / 2 - panX,
            y: (my - canvas.height / 2) / zoom + canvas.height / 2 - panY
        };
    }

    canvas.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const deltaX = e.offsetX - dragStart.x;
            const deltaY = e.offsetY - dragStart.y;
            panX += deltaX;
            panY += deltaY;
            dragStart = { x: e.offsetX, y: e.offsetY };
            drawMap();
        } else {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // Transform mouse coordinates to canvas space
            const { x, y } = screenToWorld(mouseX, mouseY);
            
            const hovered = stationData.find(s => Math.sqrt((s.x - x)**2 + (s.y - y)**2) < 20);
            if (hovered) {
                canvas.style.cursor = 'pointer';
                tooltip.style.display = 'block';
                tooltip.style.left = `${e.clientX + 15}px`;
                tooltip.style.top = `${e.clientY + 15}px`;
                tooltip.textContent = `${hovered.name} (${hovered.line})`;
            } else {
                canvas.style.cursor = 'grab';
                tooltip.style.display = 'none';
            }
        }
    });

    canvas.addEventListener('mouseup', () => {
        isDragging = false;
    });

    canvas.addEventListener('mouseleave', () => {
        isDragging = false;
        tooltip.style.display = 'none';
    });

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        // Transform mouse coordinates to canvas space using the same transformation as drawing
        const { x, y } = screenToWorld(mouseX, mouseY);
        
        const clicked = stationData.find(s => Math.sqrt((s.x - x)**2 + (s.y - y)**2) < 20);
        
        if (clicked) {
            if (!startStation || (startStation && goalStation)) {
                startStation = clicked; goalStation = null; highlightedPath = [];
                pathDisplay.innerHTML = `Departure: <b>${startStation.name}</b>. Now tap your destination.`;
                startSelect.value = startStation.name;
                endSelect.value = '';
            } else {
                goalStation = clicked;
                pathDisplay.innerHTML = `Selected: <b>${startStation.name}</b> to <b>${goalStation.name}</b>. Find route?`;
                endSelect.value = goalStation.name;
            }
            drawMap();
        }
    });

    findPathBtn.addEventListener('click', async () => {
        const s = startSelect.value || (startStation && startStation.name);
        const g = endSelect.value || (goalStation && goalStation.name);
        if (!s || !g) return;
        
        try {
            const response = await fetch('/api/find-path', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ start: s, goal: g })
            });
            
            const data = await response.json();
            
            if (data.path && data.path.length > 0) {
                highlightedPath = data.path;
                const stops = highlightedPath.length - 1;
                pathDisplay.innerHTML = `<span style="color:#4caf50; font-weight:bold;">${stops} stops:</span> ${highlightedPath.join(' → ')}`;
                startStation = stationData.find(st => st.name === s) || startStation;
                goalStation = stationData.find(st => st.name === g) || goalStation;
                startSelect.value = s;
                endSelect.value = g;
                drawMap();
            } else {
                pathDisplay.innerHTML = `<span style="color:#f44336;">No path found</span>`;
            }
        } catch (error) {
            console.error('Error finding path:', error);
            pathDisplay.innerHTML = `<span style="color:#f44336;">Error finding path</span>`;
        }
    });

    resetBtn.addEventListener('click', () => {
        startStation = null; goalStation = null; highlightedPath = [];
        pathDisplay.textContent = "Tap a station to set your departure point.";
        startSelect.value = '';
        endSelect.value = '';
        zoom = 1;
        panX = 0;
        panY = 0;
        drawMap();
    });

    window.onload = drawMap;
</script>

{% endblock %}
